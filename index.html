<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KSS Matterkey Legal Closing Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal-deep: #0b3d3f;
  --teal-mid: #0d7377;
  --teal-bright: #14a09a;
  --teal-pale: #e6f4f4;
  --coral: #e8705a;
  --coral-dark: #cf5e4a;
  --coral-light: #f4a08e;
  --coral-pale: #fdf0ed;
  --white: #ffffff;
  --text-dark: #1a3030;
  --text-mid: #3d5c5c;
  --text-light: #7a9f9f;
  --shadow: 0 4px 24px rgba(11,61,63,0.13);
  --grad-header: linear-gradient(135deg, #0b3d3f 0%, #0d7377 60%, #14a09a 100%);
  --grad-teal: linear-gradient(135deg, #0d7377 0%, #14a09a 100%);
  --grad-coral: linear-gradient(135deg, #e8705a 0%, #f4a08e 100%);
  --grad-page: linear-gradient(160deg, #e6f4f4 0%, #f0fafa 50%, #fdf5f3 100%);
  --grad-card: linear-gradient(180deg, #ffffff 0%, #f8fdfd 100%);
  --grad-green: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
  --grad-red: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
  --grad-amber: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
  --grad-blue: linear-gradient(135deg, #0d7377 0%, #14a09a 100%);
  --grad-purple: linear-gradient(135deg, #0b3d3f 0%, #0d7377 100%);
  --teal: #0d9488;
  --teal-light: #5eead4;
  --red: #dc2626;
  --amber: #d97706;
  --green: #16a34a;
  --blue: #1d4ed8;
  --gray-bg: #f8fafc;
}
* { box-sizing: border-box; }
body { background: var(--grad-page); font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; color: var(--text-dark); }
button, input, select, textarea { font-family: 'Inter', sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: linear-gradient(180deg, #e6f4f4, #b2d8d8); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #0d7377, #14a09a); border-radius: 3px; }

@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(0.7); }
  50% { opacity: 1; transform: scale(1.3); }
}
@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

#splash-screen-kss1 {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--grad-header);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.7s ease;
}
#splash-screen-kss1 .accent-line { width: 60px; height: 3px; background: linear-gradient(90deg, #e8705a, #f4a08e); border-radius: 2px; }
#splash-screen-kss1 .splash-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 44px; color: #e8705a; letter-spacing: 1px; text-shadow: 0 2px 20px rgba(232,112,90,0.4); text-align: center; }
#splash-screen-kss1 .splash-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; color: #b2d8d8; letter-spacing: 4px; text-transform: uppercase; }
#splash-screen-kss1 .dots { display: flex; gap: 10px; }
#splash-screen-kss1 .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #e8705a, #f4a08e); animation: pulse-dot 1s ease-in-out infinite; }
#splash-screen-kss1 .dot:nth-child(2) { animation-delay: 0.3s; }
#splash-screen-kss1 .dot:nth-child(3) { animation-delay: 0.6s; }

header {
  position: sticky; top: 0; z-index: 200;
  background: var(--grad-header);
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 20px rgba(11,61,63,0.4);
}
.header-title-kss2 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; color: #e8705a; letter-spacing: 1px; }
.header-sub-kss3 { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; color: #b2d8d8; letter-spacing: 3px; text-transform: uppercase; padding-left: 30px; }
#btn-hamburger-kss4 {
  background: var(--grad-coral); color: #fff; border: none; border-radius: 10px;
  padding: 10px 18px; font-size: 18px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 12px rgba(232,112,90,0.4); transition: all 0.2s;
}
#btn-hamburger-kss4:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(232,112,90,0.5); }

#hamburger-menu-kss5 {
  position: fixed; top: 66px; right: 24px; z-index: 500;
  display: none; flex-direction: column; gap: 8px;
  background: linear-gradient(160deg, #0b3d3f, #0d7377);
  border-radius: 14px; padding: 12px; min-width: 210px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
}
.hmenu-btn-kss6 {
  width: 100%; background: rgba(255,255,255,0.07); color: #b2d8d8;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 9px;
  padding: 11px 16px; text-align: left; font-weight: 600; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.18s;
}
.hmenu-btn-kss6:hover {
  background: linear-gradient(135deg, rgba(232,112,90,0.25), rgba(232,112,90,0.08));
  border-color: rgba(232,112,90,0.5); transform: translateX(3px); color: #fff;
}

#tab-bar-kss7 {
  background: linear-gradient(90deg, #0b3d3f, #0d7377);
  padding: 0 28px; display: flex; gap: 4px;
  border-bottom: 3px solid rgba(232,112,90,0.3);
}
.tab-btn {
  background: transparent; color: #7fbfbf; border: none;
  border-bottom: 3px solid transparent; margin-bottom: -3px;
  padding: 13px 24px; font-weight: 600; font-size: 13px;
  cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s;
}
.tab-btn.active { color: #e8705a; border-bottom-color: #e8705a; background: rgba(232,112,90,0.08); }
.tab-btn:hover { color: #e6f4f4; }

.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.stat-pill {
  border-radius: 50px; padding: 8px 18px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12); cursor: default; transition: all 0.2s;
}
.stat-pill:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
.stat-pill .label { font-size: 11px; font-weight: 600; color: white; text-transform: uppercase; letter-spacing: 1px; }
.stat-pill .count { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 20px; color: white; }

.expand-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
.btn-expand-kss8 {
  color: #fff; border: none; border-radius: 10px; padding: 10px 22px;
  font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
}
.btn-expand-kss8:hover { transform: translateY(-2px); }

.filter-bar {
  background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(230,244,244,0.95));
  border-radius: 12px; padding: 14px 20px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  box-shadow: var(--shadow); border: 1px solid rgba(13,115,119,0.12); backdrop-filter: blur(8px);
}
.filter-bar input, .filter-bar select {
  border: 1.5px solid rgba(13,115,119,0.2); border-radius: 8px; padding: 8px 14px;
  background: #fff; font-size: 13px; color: var(--text-dark); outline: none;
}
.filter-bar input:focus, .filter-bar select:focus {
  border-color: #0d7377; box-shadow: 0 0 0 3px rgba(13,115,119,0.15);
}

#board-kss9 { display: flex; gap: 18px; overflow-x: auto; align-items: flex-start; padding-bottom: 24px; }
.kanban-col { width: 290px; flex-shrink: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 28px rgba(13,115,119,0.12); }
.col-header {
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
}
.col-header .col-label { font-size: 11px; font-weight: 700; color: white; letter-spacing: 2px; text-transform: uppercase; }
.col-header .col-count {
  background: rgba(255,255,255,0.25); color: white; border-radius: 20px; padding: 2px 10px;
  font-weight: 700; font-size: 12px;
}
.col-cards {
  background: linear-gradient(180deg, #e6f4f4, #d4ecec);
  min-height: 320px; padding: 12px;
  transition: background 0.2s, border 0.2s;
}
.col-cards.drag-over {
  background: linear-gradient(180deg, #d4ecec, #b2d8d8);
  outline: 2px dashed #0d7377;
  outline-offset: -4px;
}

.card {
  background: var(--grad-card); border-radius: 12px; margin-bottom: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08); cursor: grab; transition: all 0.2s;
  overflow: hidden; position: relative;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(13,115,119,0.16); }
.card.dragging { opacity: 0.5; }

.card .row-a { padding: 12px 14px 6px; display: flex; justify-content: space-between; align-items: center; }
.card .file-num {
  font-size: 10px; font-weight: 700; color: white;
  background: linear-gradient(135deg, #0d7377, #14a09a);
  border-radius: 6px; padding: 3px 8px; letter-spacing: 0.5px;
}
.card .priority-badge { border-radius: 8px; padding: 2px 8px; font-weight: 700; font-size: 10px; }
.priority-urgent { background: linear-gradient(135deg, #fef2f2, #fee2e2); color: #dc2626; }
.priority-high { background: linear-gradient(135deg, #fff7ed, #fed7aa); color: #c2410c; }
.priority-normal { background: linear-gradient(135deg, #f0fdf4, #bbf7d0); color: #15803d; }

.card .row-b { padding: 4px 14px; display: flex; align-items: center; gap: 8px; }
.type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.type-badge { border-radius: 8px; padding: 3px 10px; font-weight: 600; font-size: 11px; }
.card .client-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; color: var(--text-dark); flex: 1; }

.card .row-c { padding: 4px 14px 6px; display: flex; flex-direction: column; gap: 3px; }
.card .lawyer-line { font-size: 12px; color: var(--text-mid); }
.card .address-line { font-size: 11px; color: var(--text-light); font-style: italic; }
.card .price-line { font-weight: 700; font-size: 15px; color: #16a34a; }

.card .row-d { padding: 6px 14px 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.date-pill { border-radius: 8px; padding: 3px 9px; font-weight: 600; font-size: 10px; }
.days-badge { font-weight: 700; font-size: 10px; border-radius: 8px; padding: 2px 8px; }
.btn-toggle {
  background: linear-gradient(135deg, #e6f4f4, #b2d8d8); color: #0d7377;
  border: none; border-radius: 8px; padding: 5px 12px; font-weight: 700; font-size: 11px; cursor: pointer;
}

.card .row-e { padding: 8px 14px; border-top: 1px dashed rgba(13,115,119,0.15); }
.clerk-badge {
  background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #0d7377;
  border-radius: 8px; padding: 4px 12px; font-weight: 600; font-size: 11px; display: inline-block;
}
.card .notes-text { font-size: 11px; color: var(--text-light); font-style: italic; margin-top: 6px; }

.card .row-f { padding: 6px 14px 12px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: relative; }
.btn-edit-card {
  background: linear-gradient(135deg, #e6f4f4, #b2d8d8); color: #0d7377;
  border: none; border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
}
.btn-copy-card {
  background: linear-gradient(135deg, #fff7ed, #fed7aa); color: #c2410c;
  border: none; border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
}
.btn-delete-card {
  background: linear-gradient(135deg, #fef2f2, #fecaca); color: #dc2626;
  border: none; border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
}
.btn-move-card {
  background: linear-gradient(135deg, #e6f4f4, #b2d8d8); color: #0b3d3f;
  border: none; border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 12px; cursor: pointer;
}

.move-dropdown {
  position: absolute; bottom: 100%; right: 0; z-index: 300;
  background: linear-gradient(160deg, #0b3d3f, #0d7377);
  border-radius: 10px; padding: 6px; min-width: 180px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1);
}
.move-dropdown-item {
  width: 100%; background: rgba(255,255,255,0.07); color: #b2d8d8;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 7px;
  padding: 8px 12px; text-align: left; font-weight: 600; font-size: 12px;
  cursor: pointer; margin-bottom: 4px; transition: all 0.15s;
}
.move-dropdown-item:last-child { margin-bottom: 0; }
.move-dropdown-item:hover {
  background: linear-gradient(135deg, rgba(232,112,90,0.25), rgba(232,112,90,0.08));
  border-color: rgba(232,112,90,0.5); color: #fff;
}

.dup-badge {
  background: linear-gradient(135deg, #fff7ed, #fed7aa); color: #c2410c;
  border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: 10px;
  margin: 8px 14px 0; display: inline-block;
}

#file-modal-kss10 {
  display: none; position: fixed; inset: 0; z-index: 700;
  background: rgba(11,61,63,0.7); align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
.modal-box {
  background: linear-gradient(160deg, #fff, #e6f4f4);
  border-radius: 20px; padding: 32px; width: 560px; max-width: 95vw;
  max-height: 90vh; overflow-y: auto;
  border-top: 5px solid #e8705a; box-shadow: 0 28px 80px rgba(0,0,0,0.35);
}
.modal-box label {
  font-weight: 600; font-size: 11px; color: var(--text-mid);
  text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px;
}
.modal-box input, .modal-box select, .modal-box textarea {
  width: 100%; border: 1.5px solid rgba(13,115,119,0.2); border-radius: 10px;
  padding: 10px 14px; font-size: 13px; color: var(--text-dark);
  background: #fff; outline: none; box-sizing: border-box;
}
.modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus {
  border-color: #0d7377; box-shadow: 0 0 0 3px rgba(13,115,119,0.15);
}
.modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.modal-full { grid-column: 1 / -1; }
.modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.btn-cancel-modal {
  background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: var(--text-mid);
  border: none; border-radius: 10px; padding: 12px 24px; font-weight: 600; font-size: 13px; cursor: pointer;
}
.btn-save-modal {
  background: var(--grad-coral); color: #fff; border: none; border-radius: 10px;
  padding: 12px 28px; font-weight: 700; font-size: 13px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(232,112,90,0.4); transition: all 0.2s;
}
.btn-save-modal:hover { transform: translateY(-1px); box-shadow: 0 7px 22px rgba(232,112,90,0.5); }

.dash-stat-card {
  border-radius: 18px; padding: 22px; position: relative; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.2s;
}
.dash-stat-card:hover { transform: translateY(-5px); box-shadow: 0 14px 36px rgba(0,0,0,0.15); }
.dash-stat-card .top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 5px;
}
.dash-stat-card .emoji { font-size: 30px; margin-bottom: 10px; display: block; }
.dash-stat-card .num { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 44px; color: var(--text-dark); }
.dash-stat-card .lbl { font-weight: 600; font-size: 11px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

.breakdown-card {
  background: linear-gradient(160deg, #fff, #e6f4f4); border-radius: 16px;
  padding: 22px; box-shadow: var(--shadow);
}
.breakdown-card h3 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: var(--teal-deep); margin: 0 0 14px; }
.bar-track { background: linear-gradient(90deg, #d4ecec, #e6f4f4); border-radius: 6px; height: 10px; width: 100%; overflow: hidden; }
.bar-fill { border-radius: 6px; height: 10px; transition: width 0.4s ease; }

.cal-nav {
  background: var(--grad-header); padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.cal-nav-btn {
  background: rgba(255,255,255,0.15); color: #fff;
  border: 1px solid rgba(255,255,255,0.25); border-radius: 50%;
  width: 38px; height: 38px; font-size: 22px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.cal-nav-btn:hover { background: rgba(232,112,90,0.5); }
.cal-month-label { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.weekday-row {
  display: grid; grid-template-columns: repeat(7, 1fr);
  background: linear-gradient(90deg, #0b3d3f, #0d7377); padding: 10px 16px;
}
.weekday-row span { font-size: 11px; font-weight: 700; color: #7fbfbf; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
.day-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 14px;
  background: linear-gradient(180deg, #e6f4f4, #f0fafa);
}
.day-cell {
  min-height: 85px; border-radius: 12px; padding: 8px; cursor: pointer; transition: all 0.2s;
  background: linear-gradient(145deg, #fff, #f0fafa); border: 1px solid rgba(13,115,119,0.08);
}
.day-cell:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(13,115,119,0.18); background: linear-gradient(145deg, #e6f4f4, #b2d8d8); }
.day-cell.other-month { opacity: 0.3; pointer-events: none; }
.day-num { font-weight: 700; font-size: 14px; color: var(--text-dark); margin-bottom: 4px; }
.today-num {
  background: var(--grad-coral); color: #fff; border-radius: 50%;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 14px rgba(232,112,90,0.5); font-weight: 700; font-size: 14px;
}
.cal-dot {
  color: #fff; border-radius: 6px; font-weight: 700; font-size: 9px;
  padding: 2px 6px; margin-top: 2px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%; display: block;
}

#day-popup-kss11 {
  position: fixed; z-index: 600; display: none;
  background: linear-gradient(160deg, rgba(11,61,63,0.96), rgba(13,115,119,0.96));
  backdrop-filter: blur(14px); border-radius: 16px; padding: 22px;
  min-width: 270px; max-width: 320px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12); color: #fff;
}
#day-popup-kss11 .popup-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; color: #e8705a; margin-bottom: 12px; }
#day-popup-kss11 .popup-file {
  background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
}
#day-popup-kss11 .popup-fnum { font-size: 10px; font-weight: 700; color: #7fbfbf; }
#day-popup-kss11 .popup-client { font-size: 14px; font-weight: 700; color: #fff; }

@media print {
  #splash-screen-kss1, header, #tab-bar-kss7, #hamburger-menu-kss5, .filter-bar, .expand-row, button { display: none !important; }
  body { background: #fff !important; }
  #tab-matters-kss12 { display: block !important; }
  #board-kss9 { flex-wrap: wrap !important; overflow: visible !important; }
  .kanban-col { width: 48% !important; break-inside: avoid; }
  .card { break-inside: avoid; box-shadow: none !important; }
}

@media (max-width: 767px) {
  header { padding: 12px 16px; }
  .header-title-kss2 { font-size: 18px; }
  .header-sub-kss3 { font-size: 9px; letter-spacing: 2px; padding-left: 24px; }
  #tab-bar-kss7 { padding: 0 12px; overflow-x: auto; }
  .tab-btn { padding: 10px 14px; font-size: 12px; white-space: nowrap; }
  #tab-matters-kss12, #tab-dashboard-kss13, #tab-calendar-kss14 { padding: 16px !important; }
  .stats-bar { gap: 8px; }
  .stat-pill { padding: 6px 12px; }
  .stat-pill .count { font-size: 16px; }
  .stat-pill .label { font-size: 9px; }
  .filter-bar { flex-direction: column; gap: 8px; }
  .filter-bar input, .filter-bar select { width: 100%; }
  #board-kss9 { gap: 14px; }

function daysUntil(dateStr) {
  if (!dateStr) return 9999;
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  var d = new Date(dateStr + 'T00:00:00');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function getColMeta(colId) {
  return COLUMNS.find(function(c){ return c.id === colId; }) || COLUMNS[0];
}

function getTypeColor(type) {
  var map = {Purchase:'#0d7377', Sale:'#16a34a', Refinance:'#d97706', Transfer:'#dc2626'};
  return map[type] || '#0d7377';
}
function getTypeBg(type) {
  var map = {
    Purchase:{from:'#e6f4f4',to:'#b2d8d8',text:'#0b3d3f'},
    Sale:{from:'#f0fdf4',to:'#bbf7d0',text:'#15803d'},
    Refinance:{from:'#fffbeb',to:'#fef3c7',text:'#b45309'},
    Transfer:{from:'#fef2f2',to:'#fee2e2',text:'#b91c1c'}
  };
  return map[type] || map.Purchase;
}

function priorityClass(p) {

}

// ── RENDER CARD ──
function renderCard(file, colId, isDuplicate) {
  var col = getColMeta(colId);
  var tb = getTypeBg(file.type);
  var d = daysUntil(file.closingDate);
  var urgFrom, urgTo, urgText;
  if(d<=7){urgFrom='#fef2f2';urgTo='#fee2e2';urgText='#dc2626';}
  else if(d<=14){urgFrom='#fffbeb';urgTo='#fef3c7';urgText='#b45309';}
  else{urgFrom='#f0fdf4';urgTo='#bbf7d0';urgText='#15803d';}

  var daysBadge = '';
  if(file.closingDate){
    if(d<0) daysBadge='<span class="days-badge" style="background:linear-gradient(135deg,#fef2f2,#fee2e2);color:#dc2626">'+Math.abs(d)+'d overdue</span>';
    else if(d===0) daysBadge='<span class="days-badge" style="background:linear-gradient(135deg,#fef2f2,#fee2e2);color:#dc2626">Today!</span>';
    else daysBadge='<span class="days-badge" style="background:linear-gradient(135deg,'+urgFrom+','+urgTo+');color:'+urgText+'">'+d+'d left</span>';
  }

  var dupHtml = '';
  if(isDuplicate) {
    var origCol = getColMeta(file.status);
    dupHtml = '<div class="dup-badge">⚡ Duplicate — also in '+origCol.label+'</div>';
  } else if(file.status==='col-req' && d<=7) {
    dupHtml = '<div class="dup-badge">⚡ Also in Closing Soon</div>';
  }

  var expanded = file.expanded;
  var expandedHtml = '';
  if(expanded) {
    expandedHtml = '<div class="row-e"><span class="clerk-badge">🗂 '+(escH(file.clerk)||'Unassigned')+'</span><div class="notes-text">'+escH(file.notes)+'</div></div>';
    if(!isDuplicate) {
      expandedHtml += '<div class="row-f"><button class="btn-move-card" data-action="move" data-id="'+file.id+'" data-status="'+file.status+'">📦 Move to…</button><button class="btn-edit-card" data-action="edit" data-id="'+file.id+'">✏ Edit</button><button class="btn-copy-card" data-action="copy" data-id="'+file.id+'">📋 Copy</button><button class="btn-delete-card" data-action="delete" data-id="'+file.id+'">🗑 Delete</button></div>';
    }
  }

  return '<div class="card" draggable="'+(isDuplicate?'false':'true')+'" data-file-id="'+file.id+'" data-dup="'+(isDuplicate?'1':'0')+'" style="border-left:5px solid '+col.accent+'">'
    + dupHtml
    + '<div class="row-a"><span class="file-num">'+escH(file.fileNumber)+'</span><span class="priority-badge '+priorityClass(file.priority)+'">'+escH(file.priority)+'</span></div>'
    + '<div class="row-b"><span class="type-dot" style="background:'+getTypeColor(file.type)+'"></span><span class="type-badge" style="background:linear-gradient(135deg,'+tb.from+','+tb.to+');color:'+tb.text+'">'+escH(file.type)+'</span><span class="client-name">'+escH(file.clientName)+'</span></div>'
    + '<div class="row-c"><span class="lawyer-line">👤 '+escH(file.lawyer)+'</span><span class="address-line">📍 '+escH(file.address)+'</span><span class="price-line">'+escH(file.price)+'</span></div>'
    + '<div class="row-d"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="date-pill" style="background:linear-gradient(135deg,#e6f4f4,#b2d8d8);color:#0b3d3f">REQ '+formatDate(file.reqDate)+'</span><span class="date-pill" style="background:linear-gradient(135deg,'+urgFrom+','+urgTo+');color:'+urgText+'">CLOSE '+formatDate(file.closingDate)+'</span>'+daysBadge+'</div><button class="btn-toggle" data-action="toggle" data-id="'+file.id+'">'+(expanded?'▲ Less':'▼ More')+'</button></div>'
    + expandedHtml
    + '</div>';
}

function escH(s) {
  if(!s) return '';
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ── RENDER BOARD ──
function renderBoard() {
  var search = document.getElementById('filter-search-kss26').value.toLowerCase();
  var lawyer = document.getElementById('filter-lawyer-kss27').value;
  var type = document.getElementById('filter-type-kss28').value;
  var priority = document.getElementById('filter-priority-kss29').value;

  var filtered = appData.files.filter(function(f){
    if(search && f.fileNumber.toLowerCase().indexOf(search)===-1 && f.clientName.toLowerCase().indexOf(search)===-1) return false;
    if(lawyer && f.lawyer !== lawyer) return false;
    if(type && f.type !== type) return false;
    if(priority && f.priority !== priority) return false;
    return true;
  });

  var boardEl = document.getElementById('board-kss9');
  var html = '';
  COLUMNS.forEach(function(col){
    var colFiles = filtered.filter(function(f){ return f.status === col.id; });
    var dupFiles = [];
    if(col.id === 'col-closing') {
      filtered.forEach(function(f){
        if(f.status === 'col-req' && daysUntil(f.closingDate) <= 7) {
          dupFiles.push(f);
        }
      });
    }
    // CHANGE 5: Sort DESCENDING by closing date (latest first)
    colFiles.sort(function(a,b){
      if(!a.closingDate) return 1;
      if(!b.closingDate) return -1;
      return new Date(b.closingDate) - new Date(a.closingDate);
    });
    dupFiles.sort(function(a,b){
      if(!a.closingDate) return 1;
      if(!b.closingDate) return -1;
      return new Date(b.closingDate) - new Date(a.closingDate);
    });

    var totalCount = colFiles.length + dupFiles.length;

    html += '<div class="kanban-col"><div class="col-header" style="background:'+col.grad+'"><span class="col-label">'+col.label+'</span><span class="col-count">'+totalCount+'</span></div>';
    html += '<div class="col-cards" data-col="'+col.id+'">';
    colFiles.forEach(function(f){ html += renderCard(f, col.id, false); });
    dupFiles.forEach(function(f){ html += renderCard(f, col.id, true); });
    html += '</div></div>';
  });
  boardEl.innerHTML = html;
  renderStats();
  bindCardEvents();
  bindDragDrop();
}

function bindCardEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      toggleExpand(this.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('[data-action="edit"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      openEditModal(this.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('[data-action="copy"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      copyCard(this.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('[data-action="delete"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      deleteFile(this.getAttribute('data-id'));
    });
  });
  // CHANGE 2B: Move to… button
  document.querySelectorAll('[data-action="move"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var fileId = this.getAttribute('data-id');
      var currentStatus = this.getAttribute('data-status');
      showMoveDropdown(this, fileId, currentStatus);
    });
  });
}

// ── Move Dropdown ──
var activeMoveDropdown = null;
function closeMoveDropdown() {
  if (activeMoveDropdown && activeMoveDropdown.parentNode) {
    activeMoveDropdown.parentNode.removeChild(activeMoveDropdown);
  }
  activeMoveDropdown = null;
}

function showMoveDropdown(btnEl, fileId, currentStatus) {
  closeMoveDropdown();
  var dropdown = document.createElement('div');
  dropdown.className = 'move-dropdown';
  COLUMNS.forEach(function(col) {
    if (col.id === currentStatus) return;
    var item = document.createElement('button');
    item.className = 'move-dropdown-item';
    item.textContent = col.label;
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      var file = appData.files.find(function(f){ return f.id === fileId; });
      if (file) {
        file.status = col.id;
        saveData();
        renderAll();
      }

function bindDragDrop() {
  document.querySelectorAll('.card[draggable="true"]').forEach(function(card){
    card.addEventListener('dragstart', function(e){
      dragFileId = this.getAttribute('data-file-id');
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragFileId);
    });
    card.addEventListener('dragend', function(){
      this.classList.remove('dragging');
      dragFileId = null;
    });
  });
  document.querySelectorAll('.col-cards').forEach(function(col){
    col.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      this.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function(){
      this.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      this.classList.remove('drag-over');
      var fileId = e.dataTransfer.getData('text/plain') || dragFileId;
      var newStatus = this.getAttribute('data-col');
      if(fileId && newStatus) {
        var file = appData.files.find(function(f){ return f.id === fileId; });
        if(file) { file.status = newStatus; saveData(); renderAll(); }
      }
    });
  });
}

function backupData() {

function mapOldStatusToNew(statusOverride, closingDate) {
  if (!statusOverride || statusOverride === 'auto') {
    if (!closingDate) return 'col-new';
    var d = daysUntil(closingDate);
    if (d < 0) return 'col-reporting';
    if (d <= 7) return 'col-closing';
    if (d <= 30) return 'col-req';
    return 'col-new';
  }
  var map = {
    'closed': 'col-closed',
    'overdue': 'col-reporting',
    'req': 'col-req',
    'open': 'col-new',
    'closing': 'col-closing'
  };
  return map[statusOverride.toLowerCase()] || 'col-new';
}

function formatPriceToString(price) {
  if (typeof price === 'string' && price.indexOf('$') === 0) return price;
  if (typeof price === 'number') {
    return '$' + price.toLocaleString('en-US');
  }
  if (typeof price === 'string') {
    var num = parseFloat(price.replace(/[^0-9.]/g, ''));
    if (!isNaN(num)) return '$' + num.toLocaleString('en-US');
    return price;
  }
  return '$0';
}

function normalizeFile(f) {
  var isOldFormat = f.hasOwnProperty('fileNo') || f.hasOwnProperty('property') || f.hasOwnProperty('lawyerName') || f.hasOwnProperty('requisitionDate') || f.hasOwnProperty('statusOverride');

  if (isOldFormat) {
    var closingDate = f.closingDate || '';
    return {
      id: f.id || String(Date.now() + Math.random()),
      fileNumber: f.fileNo || f.fileNumber || '',
      clientName: f.clientName || '',
      address: f.property || f.address || '',
      type: f.type || 'Purchase',
      price: formatPriceToString(f.price),
      lawyer: f.lawyerName || f.lawyer || '',
      clerk: f.clerk || '',
      reqDate: f.requisitionDate || f.reqDate || '',
      closingDate: closingDate,
      status: f.statusOverride ? mapOldStatusToNew(f.statusOverride, closingDate) : (f.status || 'col-new'),
      priority: f.priority || 'Normal',
      notes: f.notes || '',
      expanded: false
    };
  }

  return {
    id: f.id || String(Date.now() + Math.random()),
    fileNumber: f.fileNumber || '',
    clientName: f.clientName || '',
    address: f.address || '',
    type: f.type || 'Purchase',
    price: f.price || '$0',
    lawyer: f.lawyer || '',
    clerk: f.clerk || '',
    reqDate: f.reqDate || '',
    closingDate: f.closingDate || '',
    status: f.status || 'col-new',
    priority: f.priority || 'Normal',
    notes: f.notes || '',
    expanded: false
  };
}

function restoreData() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.addEventListener('change', function(e){
    var r = new FileReader();
    r.addEventListener('load', function(ev){
      try {
        var d = JSON.parse(ev.target.result);
        if(d.files && d.lawyers && d.clerks) {
          d.files = d.files.map(normalizeFile);
          appData = d;
          saveData(); renderAll(); alert('✅ Restored ' + d.files.length + ' files!');
        }
        else if (Array.isArray(d)) {
          var normalized = d.map(normalizeFile);
          appData.files = normalized;
          saveData(); renderAll(); alert('✅ Restored ' + normalized.length + ' files from legacy format!');
        }
        else if (d.matters && Array.isArray(d.matters)) {
          var normalized2 = d.matters.map(normalizeFile);
          appData.files = normalized2;
          saveData(); renderAll(); alert('✅ Restored ' + normalized2.length + ' files from legacy format!');
        }
        else { alert('Invalid file format. Expected a KSS backup JSON.'); }
      } catch(ex) { alert('Error reading file: ' + ex.message); }
    });
    r.readAsText(e.target.files[0]);
  });
  inp.click();
  closeHamburger();
}

// ── CALENDAR ──
function renderCalendar() {
  var year = calYear, month = calMonth;
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label-kss31').textContent = months[month] + ' ' + year;

  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var prevDays = new Date(year, month, 0).getDate();
  var today = new Date(); today.setHours(0,0,0,0);

  var fileMap = {};
  appData.files.forEach(function(f){
    if(!f.closingDate) return;
    if(!fileMap[f.closingDate]) fileMap[f.closingDate] = [];
    fileMap[f.closingDate].push(f);
  });

  var html = '';
  var totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for(var i = 0; i < totalCells; i++) {
    var dayNum, dateStr, isOther = false;
    if(i < firstDay) {
      dayNum = prevDays - firstDay + i + 1;
      isOther = true;
      var pm = month === 0 ? 11 : month - 1;
      var py = month === 0 ? year - 1 : year;
      dateStr = py + '-' + String(pm+1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
    } else if(i - firstDay >= daysInMonth) {
      dayNum = i - firstDay - daysInMonth + 1;
      isOther = true;
      var nm = month === 11 ? 0 : month + 1;
      var ny = month === 11 ? year + 1 : year;
      dateStr = ny + '-' + String(nm+1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
    } else {
      dayNum = i - firstDay + 1;
      dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(dayNum).padStart(2,'0');
    }

    var isToday = !isOther && (new Date(year, month, dayNum).getTime() === today.getTime());
    var filesOnDay = fileMap[dateStr] || [];

    html += '<div class="day-cell'+(isOther?' other-month':'')+'" data-date="'+dateStr+'">';
    if(isToday) {
      html += '<div class="today-num">'+dayNum+'</div>';
    } else {
      html += '<div class="day-num">'+dayNum+'</div>';
    }

    var maxDots = 2;
    filesOnDay.slice(0, maxDots).forEach(function(f){
      var col = getColMeta(f.status);
      var suffix = f.fileNumber.split('-').pop();
      html += '<span class="cal-dot" style="background:linear-gradient(135deg,'+col.accent+','+col.accent+'cc)">'+suffix+'</span>';
    });
    if(filesOnDay.length > maxDots) {
      html += '<span class="cal-dot" style="background:linear-gradient(135deg,#64748b,#94a3b8)">+' + (filesOnDay.length - maxDots) + '</span>';
    }
    html += '</div>';
  }
  document.getElementById('cal-grid-kss33').innerHTML = html;

  document.querySelectorAll('.day-cell:not(.other-month)').forEach(function(cell){
    cell.addEventListener('click', function(e){
      var date = this.getAttribute('data-date');
      var filesOnDay = fileMap[date] || [];
      if(filesOnDay.length) showDayPopup(e, date, filesOnDay);
    });
  });
}

function showDayPopup(event, dateStr, filesOnDay) {
  var popup = document.getElementById('day-popup-kss11');
  var html = '<div class="popup-title">📅 ' + formatDate(dateStr) + '</div>';
  filesOnDay.forEach(function(f){
    var col = getColMeta(f.status);
    html += '<div class="popup-file" style="border-left:3px solid '+col.accent+'"><div class="popup-fnum">'+escH(f.fileNumber)+'</div><div class="popup-client">'+escH(f.clientName)+'</div><div style="font-size:11px;color:#7fbfbf;margin-top:4px">'+escH(f.type)+' • '+escH(f.lawyer)+'</div></div>';
  });
  popup.innerHTML = html;

  var x = event.clientX, y = event.clientY;
  var pw = 300, ph = 200;
  if(x + pw > window.innerWidth) x = window.innerWidth - pw - 20;
  if(y + ph > window.innerHeight) y = y - ph;
  if(x < 10) x = 10;
  if(y < 10) y = 10;

  popup.style.left = x + 'px';
  popup.style.top = y + 'px';
  popup.style.display = 'block';
}

  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
    e.stopPropagation();
  }
}, true);
document.addEventListener('paste', function(e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
    e.stopPropagation();
  }
}, true);
document.addEventListener('cut', function(e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
    e.stopPropagation();
  }
}, true);
</script>
